spring:
  application:
    name: fieldops-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fieldops}
    username: ${POSTGRES_USER:fieldops}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  address: ${API_BIND_ADDRESS:127.0.0.1}
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
