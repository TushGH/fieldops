spring:
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: fieldops-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fieldops}
    username: ${POSTGRES_USER:fieldops}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  address: ${API_BIND_ADDRESS:127.0.0.1}
  port: ${API_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: FIELDOPS_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fieldops:
  web-origin: ${WEB_ORIGIN:http://127.0.0.1:3000}
  mail-from: ${MAIL_FROM:fieldops@localhost}
  platform-enabled: ${PLATFORM_ENABLED:false}
