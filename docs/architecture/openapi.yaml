openapi: 3.1.0
info:
  title: FieldOps API
  version: 0.4.0
  description: Application health, verified identity onboarding, business invitations, restricted platform provisioning, and tenant workspace APIs.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      operationId: getApplicationHealth
      summary: Check application reachability
      description: Returns application status without querying PostgreSQL. Use /actuator/health for aggregate dependency health.
      responses:
        '200':
          description: The application is responding.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [application, status]
                properties:
                  application:
                    type: string
                    const: fieldops-api
                  status:
                    type: string
                    const: UP
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Obtain a CSRF token and anonymous session cookie
      security: []
      responses:
        '200':
          description: Uncached CSRF header name and masked token; fetch again after login, failed login, or logout.
          headers:
            Set-Cookie:
              description: FIELDOPS_SESSION cookie if a session was created. HttpOnly; SameSite=Lax; Secure by default.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [headerName, token]
                properties:
                  headerName:
                    type: string
                    const: X-CSRF-TOKEN
                  token:
                    type: string
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with an email and password
      description: Requires the anonymous session cookie and CSRF header from GET /api/v1/auth/csrf. Uses form encoding, not JSON. No tenant or role is selected.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  description: Sent unchanged. Values exceeding 72 UTF-8 bytes cannot authenticate.
      responses:
        '204':
          description: Authenticated; session ID rotated. Fetch a fresh CSRF token and GET /api/v1/auth/me.
          headers:
            Set-Cookie:
              description: Rotated FIELDOPS_SESSION cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RequestRejected'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated global user profile
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Uncached global profile, verification evidence, and independently checked platform availability. No credential or tenant authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, displayName, email, emailVerifiedAt, platformAdmin]
                properties:
                  id:
                    type: string
                    format: uuid
                  displayName:
                    type: string
                  email:
                    type: string
                    format: email
                  emailVerifiedAt:
                    type: [string, 'null']
                    format: date-time
                  platformAdmin:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session and expire its cookie
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Session invalidated. Obtain a fresh anonymous CSRF token before logging in again.
        '403':
          $ref: '#/components/responses/RequestRejected'
  /api/v1/tenant/context:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: getTenantContext
      summary: Read validated tenant selection and role
      description: Requires an active membership and active selected tenant.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContext'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
  /api/v1/tenant:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: getSelectedTenant
      summary: Read selected tenant metadata
      description: Requires an active membership and active selected tenant.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
    patch:
      operationId: renameSelectedTenant
      summary: Rename selected tenant
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTenant'
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/tenant/memberships:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: listTenantMemberships
      summary: List selected tenant memberships
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
  /api/v1/tenant/memberships/{id}:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    get:
      operationId: getTenantMembership
      summary: Read selected tenant membership
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
  /api/v1/tenant/memberships/{id}/role:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    put:
      operationId: changeMembershipRole
      summary: Change a membership role
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMembershipRole'
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/tenant/memberships/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    post:
      operationId: deactivateMembership
      summary: Deactivate a membership
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/tenant/memberships/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    post:
      operationId: reactivateMembership
      summary: Reactivate a membership
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/auth/signup:
    post:
      operationId: requestRegistration
      summary: Request a registration email; generic response for existing identities
      security:
        - SessionCookie: []
          CsrfHeader: []
      description: Uses an anonymous or authenticated session for CSRF. No existing authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/auth/signup/complete:
    post:
      operationId: completeRegistration
      summary: Consume a registration challenge and create a verified identity
      security:
        - SessionCookie: []
          CsrfHeader: []
      description: Uses an anonymous or authenticated session for CSRF. No existing authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRegistration'
      responses:
        '204':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/auth/email-verification/request:
    post:
      operationId: requestVerification
      summary: Request verification for the authenticated legacy identity
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '202':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/auth/email-verification/confirm:
    post:
      operationId: confirmVerification
      summary: Confirm email for the matching authenticated identity
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkToken'
      responses:
        '204':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/businesses:
    get:
      operationId: listBusinesses
      summary: List active businesses for the verified current user
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessSummary'
        default:
          $ref: '#/components/responses/OnboardingFailure'
    post:
      operationId: createBusiness
      summary: Create business and initial owner membership for the verified current user
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusiness'
      responses:
        '201':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSummary'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/invitations/resolve:
    post:
      operationId: resolveInvitation
      summary: Resolve a live token to an invitation ID without disclosing its recipient
      security:
        - SessionCookie: []
          CsrfHeader: []
      description: Uses an anonymous or authenticated session for CSRF. No existing authenticated account is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkToken'
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationReference'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/invitations:
    get:
      operationId: listRecipientInvitations
      summary: List up to 100 newest unexpired pending invitations for the verified recipient
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/invitations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRecipientInvitation
      summary: Read invitation addressed to the verified current user; wrong account returns 404
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/invitations/{id}/accept:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: acceptInvitation
      summary: Atomically accept after validating recipient, issuer, membership, tenant and expiry
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptance'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/tenant/invitations:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: listBusinessInvitations
      summary: Current owner reads up to 100 latest invitations in the selected business
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
    post:
      operationId: createInvitation
      summary: Current owner invites a recipient without creating an identity or membership
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
      responses:
        '201':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/tenant/invitations/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: revokeInvitation
      summary: Current owner revokes a pending invitation in the selected business
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/tenant/invitations/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: resendInvitation
      summary: Current owner replaces an unaccepted invitation; invalidates old pending token
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/tenant/onboarding:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: getOnboarding
      summary: Read selected business readiness; membership flows are deferred
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingReadiness'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/tenant/onboarding/business/complete:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    post:
      operationId: completeBusinessSetup
      summary: Current owner completes checklist after server validates stored business identity
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingReadiness'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/platform/access:
    get:
      operationId: getPlatformAccess
      summary: Check current independent platform grant; requires platform-enabled configuration
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccess'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/platform/businesses:
    post:
      operationId: provisionBusiness
      summary: Platform operator creates PROVISIONING business and initial-owner invitation
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionBusiness'
      responses:
        '201':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/platform/businesses/{id}/owner-invitation:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: reissueOwnerInvitation
      summary: Platform operator replaces initial-owner offer for a PROVISIONING business
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerEmail'
      responses:
        '200':
          description: Successful operation. See identity-onboarding.md for workflow and delivery semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/OnboardingFailure'
components:
  parameters:
    SelectedTenant:
      in: header
      name: X-Tenant-ID
      required: true
      description: One canonical tenant UUID. Validated against authenticated user and active membership; never sufficient authority by itself.
      schema: {type: string, format: uuid}
    MembershipId:
      in: path
      name: id
      required: true
      description: Membership UUID searched only within the validated tenant.
      schema: {type: string, format: uuid}
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: FIELDOPS_SESSION
      description: Anonymous for CSRF/login; authenticated for current-user requests. Managed by the browser, never copied into local storage.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token obtained for the same session from GET /api/v1/auth/csrf.
  schemas:
    SignupRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 254}
    LinkToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
    CompleteRegistration:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          description: At least 15 Unicode code points and at most 72 UTF-8 bytes; never normalized.
    CreateBusiness:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, minLength: 3, maxLength: 63}
    BusinessSummary:
      type: object
      required: [id, name, slug, role]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        role: {$ref: '#/components/schemas/MembershipRole'}
    OwnerEmail:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    ProvisionBusiness:
      type: object
      additionalProperties: false
      required: [name, slug, email]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, minLength: 3, maxLength: 63}
        email: {type: string, format: email, maxLength: 254}
    CreateInvitation:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {type: string, format: email, maxLength: 254}
        role: {$ref: '#/components/schemas/MembershipRole'}
    InvitationReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, format: uuid}
    InvitationAcceptance:
      type: object
      additionalProperties: false
      required: [tenantId, membershipId]
      properties:
        tenantId: {type: string, format: uuid}
        membershipId: {type: string, format: uuid}
    Invitation:
      type: object
      additionalProperties: false
      required: [id, tenantId, businessName, email, role, purpose, status, expiresAt, invitedByUserId]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        businessName: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/MembershipRole'}
        purpose: {type: string, enum: [TEAM_MEMBER, INITIAL_OWNER]}
        status: {type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]}
        expiresAt: {type: string, format: date-time}
        invitedByUserId: {type: string, format: uuid}
    OnboardingReadiness:
      type: object
      additionalProperties: false
      required: [businessComplete, requiredVersion, businessSetupRequired, businessChecklist, membershipFlows]
      properties:
        businessComplete: {type: boolean}
        requiredVersion: {type: integer, const: 1}
        businessSetupRequired: {type: boolean}
        businessChecklist: {type: array, items: {type: string}}
        membershipFlows:
          type: array
          maxItems: 0
          description: No role-specific domain checklist exists in this milestone.
          items: {type: string}
    PlatformAccess:
      type: object
      additionalProperties: false
      required: [platformAdmin]
      properties:
        platformAdmin: {type: boolean, const: true}
    MembershipRole:
      type: string
      enum: [BUSINESS_OWNER, DISPATCHER, TECHNICIAN]
    TenantContext:
      type: object
      additionalProperties: false
      required: [userId, tenantId, membershipId, role]
      properties:
        userId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        membershipId: {type: string, format: uuid}
        role:
          $ref: '#/components/schemas/MembershipRole'
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        status: {type: string, enum: [PROVISIONING, ACTIVE, SUSPENDED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    Membership:
      type: object
      additionalProperties: false
      required: [id, tenantId, userId, status, role, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        role:
          $ref: '#/components/schemas/MembershipRole'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    MembershipPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    RenameTenant:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    ChangeMembershipRole:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
    TenantError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    AuthenticationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, REQUEST_REJECTED]
        message:
          type: string
  responses:
    OnboardingFailure:
      description: 400 invalid input/link; 401 authentication required; 403 verification/authority/CSRF denied; 404 inaccessible invitation; 409 uniqueness, inactive relationship or unavailable invitation; 429 bounded rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantBadRequest:
      description: Missing or malformed tenant selection, invalid payload, or invalid pagination.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantDenied:
      description: Inactive or unrelated tenant/membership, insufficient tenant role, or CSRF failure. No distinction between nonexistent and unrelated tenants.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantNotFound:
      description: No such resource in the selected tenant. Foreign resource IDs produce the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantConflict:
      description: Last active owner membership must be preserved, or a concurrent modification occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    Unauthenticated:
      description: Missing/expired session, inactive account, or invalid credentials. Unknown and unprovisioned users produce the same login failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
    RequestRejected:
      description: Missing or invalid CSRF protection; not a business permission decision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
