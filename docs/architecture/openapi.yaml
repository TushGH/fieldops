openapi: 3.1.0
info:
  title: FieldOps API
  version: 0.4.0
  description: Application health, business onboarding, session authentication, and role-checked tenant workspace APIs. Customer and work-order APIs remain unimplemented.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/onboarding:
    post:
      operationId: onboardBusiness
      summary: Create a new business and new owner atomically
      description: Requires an anonymous session cookie and CSRF token. Creates a new user only; never links an existing email. Server assigns BUSINESS_OWNER to the new business. Signup does not log in the owner.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessName, slug, ownerName, email, password]
              properties:
                businessName:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  minLength: 3
                  maxLength: 63
                  pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  description: Permanent unique business identifier; canonicalized to lowercase.
                ownerName:
                  type: string
                  minLength: 1
                  maxLength: 200
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Canonical ASCII email; globally unique and not verified by signup.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 15
                  maxLength: 72
                  description: At least 15 Unicode code points and at most 72 UTF-8 bytes; never normalized.
      responses:
        '201':
          description: Business, owner, credential, and owner membership committed. No response body. Sign in through the existing login endpoint.
        '400':
          description: Invalid input or unknown fields; nothing persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantError'
        '403':
          $ref: '#/components/responses/RequestRejected'
        '409':
          description: ONBOARDING_CONFLICT; duplicate slug or canonical email. No distinction is exposed and nothing from this request persists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingConflict'
  /api/v1/businesses:
    get:
      operationId: getMyBusinesses
      summary: List the signed-in user's active businesses
      description: Derived solely from the session identity, without a tenant selection. Filters inactive memberships and suspended businesses. Ordered by name and ID; an empty list grants no platform authority.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Uncached business summaries, with only the current user's role in each business.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name, slug, role]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    slug:
                      type: string
                    role:
                      type: string
                      enum: [BUSINESS_OWNER, DISPATCHER, TECHNICIAN]
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/health:
    get:
      operationId: getApplicationHealth
      summary: Check application reachability
      description: Returns application status without querying PostgreSQL. Use /actuator/health for aggregate dependency health.
      responses:
        '200':
          description: The application is responding.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [application, status]
                properties:
                  application:
                    type: string
                    const: fieldops-api
                  status:
                    type: string
                    const: UP
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Obtain a CSRF token and anonymous session cookie
      security: []
      responses:
        '200':
          description: Uncached CSRF header name and masked token; fetch again after login, failed login, or logout.
          headers:
            Set-Cookie:
              description: FIELDOPS_SESSION cookie if a session was created. HttpOnly; SameSite=Lax; Secure by default.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [headerName, token]
                properties:
                  headerName:
                    type: string
                    const: X-CSRF-TOKEN
                  token:
                    type: string
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with an email and password
      description: Requires the anonymous session cookie and CSRF header from GET /api/v1/auth/csrf. Uses form encoding, not JSON. No tenant or role is selected.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  description: Sent unchanged. Values exceeding 72 UTF-8 bytes cannot authenticate.
      responses:
        '204':
          description: Authenticated; session ID rotated. Fetch a fresh CSRF token and GET /api/v1/auth/me.
          headers:
            Set-Cookie:
              description: Rotated FIELDOPS_SESSION cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RequestRejected'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated global user profile
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Uncached profile with no credentials, roles, memberships, or tenant claims.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, displayName, email]
                properties:
                  id:
                    type: string
                    format: uuid
                  displayName:
                    type: string
                  email:
                    type: string
                    format: email
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session and expire its cookie
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Session invalidated. Obtain a fresh anonymous CSRF token before logging in again.
        '403':
          $ref: '#/components/responses/RequestRejected'
  /api/v1/tenant/context:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: getTenantContext
      summary: Read validated tenant selection and role
      description: Requires an active membership and active selected tenant.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContext'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
  /api/v1/tenant:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: getSelectedTenant
      summary: Read selected tenant metadata
      description: Requires an active membership and active selected tenant.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
    patch:
      operationId: renameSelectedTenant
      summary: Rename selected tenant
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTenant'
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/tenant/memberships:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
    get:
      operationId: listTenantMemberships
      summary: List selected tenant memberships
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
  /api/v1/tenant/memberships/{id}:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    get:
      operationId: getTenantMembership
      summary: Read selected tenant membership
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
  /api/v1/tenant/memberships/{id}/role:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    put:
      operationId: changeMembershipRole
      summary: Change a membership role
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMembershipRole'
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/tenant/memberships/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    post:
      operationId: deactivateMembership
      summary: Deactivate a membership
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
  /api/v1/tenant/memberships/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/SelectedTenant'
      - $ref: '#/components/parameters/MembershipId'
    post:
      operationId: reactivateMembership
      summary: Reactivate a membership
      description: Requires BUSINESS_OWNER in the selected tenant.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Tenant-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/TenantBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantDenied'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '409':
          $ref: '#/components/responses/TenantConflict'
components:
  parameters:
    SelectedTenant:
      in: header
      name: X-Tenant-ID
      required: true
      description: One canonical tenant UUID. Validated against authenticated user and active membership; never sufficient authority by itself.
      schema: {type: string, format: uuid}
    MembershipId:
      in: path
      name: id
      required: true
      description: Membership UUID searched only within the validated tenant.
      schema: {type: string, format: uuid}
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: FIELDOPS_SESSION
      description: Anonymous for CSRF/login; authenticated for current-user requests. Managed by the browser, never copied into local storage.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token obtained for the same session from GET /api/v1/auth/csrf.
  schemas:
    OnboardingConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: ONBOARDING_CONFLICT
        message:
          type: string
    MembershipRole:
      type: string
      enum: [BUSINESS_OWNER, DISPATCHER, TECHNICIAN]
    TenantContext:
      type: object
      additionalProperties: false
      required: [userId, tenantId, membershipId, role]
      properties:
        userId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        membershipId: {type: string, format: uuid}
        role:
          $ref: '#/components/schemas/MembershipRole'
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    Membership:
      type: object
      additionalProperties: false
      required: [id, tenantId, userId, status, role, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        role:
          $ref: '#/components/schemas/MembershipRole'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    MembershipPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    RenameTenant:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    ChangeMembershipRole:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
    TenantError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    AuthenticationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, REQUEST_REJECTED]
        message:
          type: string
  responses:
    TenantBadRequest:
      description: Missing or malformed tenant selection, invalid payload, or invalid pagination.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantDenied:
      description: Inactive or unrelated tenant/membership, insufficient tenant role, or CSRF failure. No distinction between nonexistent and unrelated tenants.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantNotFound:
      description: No such resource in the selected tenant. Foreign resource IDs produce the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    TenantConflict:
      description: Last active owner membership must be preserved, or a concurrent modification occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantError'
    Unauthenticated:
      description: Missing/expired session, inactive account, or invalid credentials. Unknown and unprovisioned users produce the same login failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
    RequestRejected:
      description: Missing or invalid CSRF protection; not a business permission decision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
